# =============================================================================
# CHRONOS SUBMISSION PORTAL - APPLICATION CONFIGURATION
# =============================================================================
spring.application.name=chronos-portal
server.port=${PORT:8080}

# -----------------------------------------------------------------------------
# NeonDB Serverless PostgreSQL Configuration
# Injected via .env locally or Environment Variables on Render/Docker
# -----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Optimized for Serverless NeonDB)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Hibernate & JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# -----------------------------------------------------------------------------
# Security & JWT Configuration
# -----------------------------------------------------------------------------
# Base64 encoded 256-bit HMAC secret
jwt.secret=${JWT_SECRET}
# 12 Hours in milliseconds (43,200,000 ms)
jwt.expiration=43200000

# Default Admin Seed Credentials
app.default.admin.username=${ADMIN_USERNAME:admin}
app.default.admin.password=${ADMIN_PASSWORD:admin123}

# -----------------------------------------------------------------------------
# Swagger UI & OpenAPI 3 Specification
# -----------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
